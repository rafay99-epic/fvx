name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck # CLI and web
      - run: bun test # root bunfig.toml points this at apps/cli with the sandbox preload
      - run: bun run build:web
      - name: release-style build compiles
        shell: bash
        run: |
          bun build ./apps/cli/bin/fvx.ts --compile --minify --outfile out/fvx
          ./out/fvx version
        env:
          FVX_HOME: ${{ runner.temp }}/fvx-ci-home
